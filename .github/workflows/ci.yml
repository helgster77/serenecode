name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra mcp

      - name: mypy (strict)
        run: uv run mypy src examples/dosage-serenecode/src

      - name: SereneCode self-check (Level 2)
        run: uv run serenecode check src --level 2

      - name: pytest
        run: uv run pytest -q

      - name: Dosage example self-check (Level 2)
        run: uv run serenecode check examples/dosage-serenecode/src --level 2 --project-root examples/dosage-serenecode

  full-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra mcp

      - name: SereneCode full self-check (Level 6)
        run: uv run serenecode check src --level 6 --allow-code-execution
